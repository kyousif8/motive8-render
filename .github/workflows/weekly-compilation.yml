name: weekly-compilation
on:
  schedule:
    - cron: "0 8 * * 0"   # every Sunday 08:00 UTC (11:00 Cairo)
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Optional JSON list [{"n":75,"title":"..."}]; empty = stories from the last 7 days'
        required: false
        default: ""
      post_to_youtube:
        description: "Upload the result to YouTube (through the Make webhook)"
        required: false
        default: "true"
permissions:
  contents: write
concurrency: weekly-compilation
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (apt 6.1, the version the renderer was built and tested on)
        id: apt_ffmpeg
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99net >/dev/null
          timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg \
            || { timeout 120 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -q ' drawtext '
      - name: Install ffmpeg (fallback, main Ubuntu mirror, then static build with drawtext)
        if: steps.apt_ffmpeg.outcome != 'success'
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          has_drawtext() { command -v ffmpeg >/dev/null && ffmpeg -hide_banner -filters 2>/dev/null | grep -q ' drawtext '; }
          if has_drawtext; then ffmpeg -version | head -1; exit 0; fi
          # The runner's default Azure mirror is what hangs; retry apt on the main Ubuntu archive.
          sudo pkill -9 -f 'apt-get|dpkg' 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          if timeout 150 sudo apt-get update -qq && timeout 200 sudo apt-get install -y -qq --no-install-recommends ffmpeg && has_drawtext; then
            ffmpeg -version | head -1; exit 0
          fi
          # Last resort: BtbN static GPL build (has freetype/drawtext). Prefer 6.1, else newest release branch.
          echo "apt failed on both mirrors, using BtbN static build"
          names=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' | grep -E '^ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -V)
          name=$(echo "$names" | grep -- '-gpl-6\.1\.' | head -1)
          [ -n "$name" ] || name=$(echo "$names" | tail -1)
          echo "using $name"
          curl -fsSL --retry 4 --retry-delay 5 --max-time 240 -o /tmp/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name"
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo /tmp/ff/bin >> "$GITHUB_PATH"
          export PATH=/tmp/ff/bin:$PATH
          has_drawtext || { echo "::error::no ffmpeg with drawtext could be installed"; exit 1; }
          ffmpeg -version | head -1
      - name: Download font
        run: |
          mkdir -p fonts
          curl -sL --retry 3 -o fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
      - name: Build and queue the compilation
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MANIFEST: ${{ github.event.inputs.manifest }}
          POST_TO_YOUTUBE: ${{ github.event.inputs.post_to_youtube || 'true' }}
        run: python3 compile.py
