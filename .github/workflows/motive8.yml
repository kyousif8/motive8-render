name: motive8
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Render job (JSON or compact ~ format sent by Make)"
        required: true
permissions:
  contents: write
concurrency: motive8
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-voice.txt
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Install ffmpeg, font and voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements-voice.txt
          mkdir -p fonts
          curl -sL -o fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
      - name: Write job file
        env:
          JOB: ${{ github.event.inputs.job }}
        run: printf '%s' "$JOB" > job.txt
      - name: Voice (Kokoro am_michael, falls back to Deepgram)
        continue-on-error: true
        run: python3 kokoro_tts.py job.txt
      - name: Render
        run: python3 render2.py job.txt
      - name: Publish to the "renders" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view renders >/dev/null 2>&1 || gh release create renders --title renders --notes "Motive8 rendered videos"
          gh release upload renders out/*.mp4 --clobber
      - name: Queue on TikTok via Buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 buffer_post.py job.txt
