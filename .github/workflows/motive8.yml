name: motive8
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Render job (JSON or compact ~ format sent by Make)"
        required: true
permissions:
  contents: write
concurrency: motive8
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and font
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p fonts
          curl -sL -o fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
      - name: Write job file
        env:
          JOB: ${{ github.event.inputs.job }}
        run: printf '%s' "$JOB" > job.txt
      - name: Render
        run: python3 render2.py job.txt
      - name: Publish to the "renders" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view renders >/dev/null 2>&1 || gh release create renders --title renders --notes "Motive8 rendered videos"
          gh release upload renders out/*.mp4 --clobber
      - name: Queue on TikTok via Buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 buffer_post.py job.txt
