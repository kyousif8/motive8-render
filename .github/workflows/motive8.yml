name: motive8
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Render job (JSON or compact ~ format sent by Make)"
        required: true
permissions:
  contents: write
concurrency: motive8
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-voice.txt
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Download font
        run: |
          mkdir -p fonts
          curl -sL --retry 3 -o fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
      - name: Install espeak-ng (best effort, Kokoro bundles its own)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99net >/dev/null
          timeout 90 sudo apt-get install -y -qq --no-install-recommends espeak-ng \
            || { timeout 120 sudo apt-get update -qq && timeout 90 sudo apt-get install -y -qq --no-install-recommends espeak-ng; }
      - name: Install voice (Kokoro)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do timeout 300 pip install -q --timeout 60 torch --index-url https://download.pytorch.org/whl/cpu && timeout 240 pip install -q --timeout 60 -r requirements-voice.txt && break; echo "pip retry $i"; sleep 5; done
      - name: Write job file
        env:
          JOB: ${{ github.event.inputs.job }}
        run: printf '%s' "$JOB" > job.txt
      - name: Voice (Kokoro am_michael, falls back to Deepgram)
        continue-on-error: true
        run: python3 kokoro_tts.py job.txt
      - name: Render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 render2.py job.txt
      - name: Publish to the "renders" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view renders >/dev/null 2>&1 || gh release create renders --title renders --notes "Motive8 rendered videos"
          gh release upload renders out/*.mp4 --clobber
      - name: Save story for the weekly compilation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 save_story.py job.txt
      - name: Queue on TikTok via Buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 buffer_post.py job.txt
