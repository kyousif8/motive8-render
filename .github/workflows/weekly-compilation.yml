name: weekly-compilation
on:
  schedule:
    - cron: "0 8 * * 0"   # every Sunday 08:00 UTC (11:00 Cairo)
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Optional JSON list [{"n":75,"title":"..."}]; empty = stories from the last 7 days'
        required: false
        default: ""
      post_to_youtube:
        description: "Upload the result to YouTube (through the Make webhook)"
        required: false
        default: "true"
permissions:
  contents: write
concurrency: weekly-compilation
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (apt 6.1, the version the renderer was built and tested on)
        id: apt_ffmpeg
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99net >/dev/null
          timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg \
            || { timeout 120 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ffmpeg -version | head -1
      - name: Install ffmpeg (fallback 1, setup-ffmpeg pinned to 6.1)
        id: action_ffmpeg
        if: steps.apt_ffmpeg.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 4
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: "6.1"
      - name: Install ffmpeg (fallback 2, apt via main Ubuntu mirror, then static 6.1 build)
        if: steps.apt_ffmpeg.outcome != 'success' && steps.action_ffmpeg.outcome != 'success'
        timeout-minutes: 8
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          # The runner's default Azure mirror is what hung; switch to the main Ubuntu archive.
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo pkill -9 -f 'apt-get|dpkg' 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a || true
          if timeout 150 sudo apt-get update -qq && timeout 200 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then
            ffmpeg -version | head -1; exit 0
          fi
          echo "apt mirror failed too, trying static 6.1 build"
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n6.1-latest-linux64-gpl-6.1.tar.xz
          curl -fsSL --retry 4 --retry-delay 5 --max-time 180 -o /tmp/ff.tar.xz "$url"
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo /tmp/ff/bin >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1
      - name: Download font
        run: |
          mkdir -p fonts
          curl -sL --retry 3 -o fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
      - name: Build and queue the compilation
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MANIFEST: ${{ github.event.inputs.manifest }}
          POST_TO_YOUTUBE: ${{ github.event.inputs.post_to_youtube || 'true' }}
        run: python3 compile.py
